<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>FILG — build your business</title>
<link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E%3Crect width="32" height="32" rx="8" fill="%23FF6B4A"/%3E%3C/svg%3E'>
__FILG_HEAD__
<link rel="stylesheet" href="/static/styles.css">
</head><body>
<!-- ── ONE surface: the landing IS the workspace with the left drawer fully expanded and the box
     centered. The first prompt collapses it into the sidebar — no swap, no fly-away. ── -->
<div id=workspace class="workspace full">
  <aside class=left id=left>
    <div class=left-top id=lefttop>
      <button type=button class=logo onclick="v2newPlan()">FILG</button>
      <button type=button class="ghost hmenu" id=hmenu onclick="toggleHMenu()" aria-label="Menu" title="Menu">☰</button>
      <div class=lt-right id=ltright>
        <button id=stackchip-w class="ghost stackchip" type=button onclick="stackModal();closeHMenu()" title="Pick your model crew"></button>
        <button id=tierchip class="ghost stackchip tierchip" type=button hidden onclick="pricingModal();closeHMenu()" title="Your plan + this month's allowance"></button>
        <span class=meter id=meter title="tokens + $ this session">0 tok · $0.00</span>
        <button type=button class=profile id=profilebtn onclick="profileClick();closeHMenu()" aria-label="Account" title="Account">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.5 19.5c1.3-3.4 4.2-5 7.5-5s6.2 1.6 7.5 5"/></svg>
          <span class=acctlabel>Account</span>
        </button>
      </div>
    </div>
    <div class=hero id=hero>
      <h1 id=landing-head>Let's build your business.</h1>
      <p id=landing-sub>Drop in an idea, even if it's vague, about what you're good at, what you want to
        sell, or what you enjoy doing. Don't overthink it, we'll smooth it out as we go.</p>
      <div class=err id=landing-err></div>
      <div id=landing-joke></div>
      <button type=button class=fineprint onclick="disclaimerModal()">Just so we're clear: this is for fun, not advice ›</button>
    </div>
    <!-- Research mode (in-drawer display): the SAME chat, different UX — the list replaces or
         splits with the chat history; the conversation itself is never dropped. -->
    <div class=rpane id=rpane aria-hidden=true>
      <div class=rpane-head><span>Graded research</span>
        <button type=button class="ghost small" id=rexpand onclick="expandResearch()" title="Slide the research out into its own drawer">⇥ Expand</button></div>
      <div class=rlist id=rlist></div>
      <div class=vgrip data-pane=rpane title="Drag to resize"></div>
    </div>
    <!-- Help: a banner above the chat (the split mechanism) — the one-paragraph how-to plus the
         user's own past help Q&As as a personal FAQ. No drawer. -->
    <div class=rpane id=hpane aria-hidden=true>
      <div class=rpane-head><span>Help</span></div>
      <div class=rlist id=hlist></div>
      <div class=vgrip data-pane=hpane title="Drag to resize"></div>
    </div>
    <!-- Summary: the in-voice idea summary (v1's top-of-page block), as a display state — review it,
         or just keep chatting under it; the conversation is the same one chat. -->
    <div class=rpane id=spane aria-hidden=true>
      <div class=rpane-head><span>Summary</span></div>
      <div class=rlist id=slist></div>
      <div class=vgrip data-pane=spane title="Drag to resize"></div>
    </div>
    <!-- Board room (same one-chat/three-displays contract as research): the pill shows the convene
         history + the stress-test; a question splits the drawer; ⇥ Expand slides it out. -->
    <div class=rpane id=bpane aria-hidden=true>
      <div class=rpane-head><span>Board room</span>
        <span class=bacts>
          <button type=button class="ghost small" onclick="forgeModal()" title="Forge a custom director">⚒ Forge</button>
          <button type=button class="ghost small" onclick="stressGo()" title="Adversarial assumption stress-test">🧪 Stress-test</button>
          <button type=button class="ghost small" onclick="expandBoard()" title="Slide the board out into its own drawer">⇥ Expand</button>
        </span></div>
      <div class=bseats id=bseats title="Who's seated — click to bench/seat for the next convene"></div>
      <div class=rlist id=blist></div>
      <div class=vgrip data-pane=bpane title="Drag to resize"></div>
    </div>
    <div class=chatlog id=chatlog aria-live=polite></div>
    <div class="promptwrap" id=ws-wrap>
      <div class=modechips id=modechips>
        <button type=button data-mode=build class="mchip on" onclick="setMode('build')">Build</button>
        <button type=button data-mode=summary class=mchip onclick="setMode('summary')">Summary</button>
        <button type=button data-mode=research class=mchip onclick="setMode('research')">Research</button>
        <button type=button data-mode=board class=mchip onclick="setMode('board')">Board</button>
        <button type=button data-mode=help class=mchip onclick="setMode('help')">Help</button>
      </div>
      <textarea id=ws-box rows=3 aria-label="Talk to FILG" placeholder="Tell me what to change, or just talk to it…"></textarea>
      <button type=button class=qmark id=landing-q onclick="toggleLandingHelp()" aria-label="How does this work?" title="How does this work?">?</button>
      <button type=button class=send id=ws-send onclick="sendPrompt()">Send →</button>
      <div class=err id=ws-err></div>
    </div>
    <button type=button class=mrail-in onclick="mToggle()" aria-label="Collapse the chat drawer" title="Collapse">&#8249;</button>
    <div class=hgrip data-drawer=left title="Drag to resize the drawer"></div>
  </aside>
  <!-- Research EXPANDED: the stack slides out into its own left-anchored drawer (v1-style column)
       and the chat gets the full leftmost drawer back. -->
  <aside class=rdrawer id=rdrawer aria-hidden=true>
    <div class=rpane-head><span>Graded research</span>
      <span class=bacts>
        <button type=button class="ghost small" onclick="collapseResearch()" title="Tuck the research back into the chat drawer">⇤ Tuck in</button>
      </span></div>
    <button type=button class=mrail-in onclick="mToggle()" aria-label="Collapse the drawer" title="Collapse">&#8249;</button>
    <div class=rlist id=rlist2></div>
    <div class=hgrip data-drawer=rdrawer title="Drag to resize"></div>
  </aside>
  <aside class=rdrawer id=bdrawer aria-hidden=true>
    <div class=rpane-head><span>Board room</span>
      <span class=bacts>
        <button type=button class="ghost small" onclick="forgeModal()" title="Forge a custom director">⚒ Forge</button>
        <button type=button class="ghost small" onclick="stressGo()" title="Adversarial assumption stress-test">🧪 Stress-test</button>
        <button type=button class="ghost small" onclick="collapseBoard()" title="Tuck the board back into the chat drawer">⇤ Tuck in</button>
      </span></div>
    <button type=button class=mrail-in onclick="mToggle()" aria-label="Collapse the drawer" title="Collapse">&#8249;</button>
    <div class=bseats id=bseats2 title="Who's seated — click to bench/seat for the next convene"></div>
    <div class=rlist id=blist2></div>
    <div class=hgrip data-drawer=bdrawer title="Drag to resize"></div>
  </aside>
  <button id=mrail type=button onclick="mToggle()" aria-label="Open the drawer" title="Open">&#8250;</button>
  <main class=right id=right>
    <!-- The decision graph IS the right side. Documents and steps live INSIDE the nodes: the camera
         zooms into the node that's ready (its content expands in place), zooms out when you type
         (content collapses back into the node), and follows the build as lines + nodes draw in real
         time. Research leaflets fan out of a working node and resolve. Drag to pan, wheel to zoom. -->
    <div id=vtabs role=tablist>
      <button type=button data-v=graph class=on role=tab onclick="setView('graph')">Decision graph</button>
      <button type=button data-v=docs role=tab onclick="setView('docs')">Documents</button>
      <button type=button data-v=roadmap role=tab onclick="setView('roadmap')">Roadmap</button>
    </div>
    <div id=graph><div id=gview><svg id=gedges xmlns="http://www.w3.org/2000/svg"></svg><div id=gnodes></div></div>
      <!-- Graph chrome: search-glow (PoE pattern), fit/zoom controls, and the minimap (branch
           structure + viewport, click-to-jump). All render from the last layout — no extra state. -->
      <div id=gctrls>
        <!-- search collapses to a magnifier that expands the input on click (all screen sizes) -->
        <div id=gsearchwrap>
          <button type=button id=gsearchbtn onclick="toggleSearch()" aria-label="Search the tree" title="Search the tree (/)">🔍<span class=gclabel>Search</span></button>
          <input id=gsearch type=search placeholder="Search the tree…" autocomplete=off
                 oninput="gSearch(this.value)" onblur="searchBlur()" onkeydown="searchKey(event)">
          <span id=gsearch-n class=gsn hidden></span>
        </div>
        <!-- fit/center + zoom; on mobile these live inside the ⋯ dropdown, +/− on one row -->
        <div id=gzoom>
          <button type=button id=gfit onclick="fitView();closeGMenu()" title="Center the whole tree (F)"><span class=gclabel>Center</span><span class=gcicon>⤢</span></button>
          <div id=gzoomrow>
            <button type=button onclick="zoomStep(0.8)" title="Zoom out (−)">−</button>
            <button type=button onclick="zoomStep(1.25)" title="Zoom in (+)">+</button>
          </div>
        </div>
        <button type=button id=gmenu onclick="toggleGMenu()" aria-label="Graph controls" title="Graph controls">⋯</button>
      </div>
      <div id=minimap title="Click to jump"></div>
    </div>
    <div id=docs hidden><div id=dtabs role=tablist></div><div id=docpane></div></div>
    <!-- The Roadmap + Codex surface (execution layer). Hosts the standalone /plan/{id}/roadmap page
         as a first-class right-panel view beside the graph and documents. Lazy-loaded on first open. -->
    <div id=roadmap hidden><iframe id=roadframe title="Roadmap" style="width:100%;height:100%;border:0;display:block"></iframe></div>
    <button id=gpill type=button hidden onclick="focusActive()">▣ Current step</button>
  </main>
</div>
<!-- The account surface: projects / files / API key / account, ported from v1 to the v2 shell.
     A full overlay with real routes (/v2/account/<tab>) so refresh + Stripe returns land right. -->
<div id=account class=account hidden></div>
<div class=modalback id=modalback onclick="closeModal()"></div>
<div class=modal id=v2modal role=dialog aria-modal=true hidden>
  <div class=modal-h><span id=modal-title>Key</span><button type=button class=ghost small onclick="closeModal()">✕</button></div>
  <div class=modal-body id=modal-body></div>
  <div class=modal-acts id=modal-acts></div>
</div>
<div class=toasts id=toasts></div>
<script src="/static/app.js"></script>
</body></html>
