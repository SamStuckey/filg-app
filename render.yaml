# Render blueprint — one-click deploy once the repo is on GitHub.
# Render dashboard → New → Blueprint → pick the filg-app repo. Set the `sync: false` secrets when prompted.
# Auth + billing are optional: leave the SUPABASE_*/STRIPE_* keys blank to launch free-tier-only;
# fill them to turn on real login + the $39/mo Operator plan (no redeploy logic changes).
services:
  - type: web
    name: filg
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Persistent disk so the SQLite DB (jobs, results, usage caps) survives redeploys — without it
    # the container filesystem is ephemeral and caps/share-links reset on every deploy.
    disk:
      name: filg-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY     # secret — set in the dashboard
        sync: false
      - key: FILG_DB               # SQLite path on the persistent disk (jobs + usage share it)
        value: /var/data/filg.db
      - key: FILG_PAID_EMAILS      # secret — manual comp allowlist (real paid status comes from Stripe)
        sync: false
      - key: FILG_FREE_RUNS        # free plans per user; 0 = uncapped (DEV — restore to 3 before charging)
        value: "0"
      - key: FILG_DAILY_BUDGET     # global $/day kill switch (cost guardrail)
        value: "5"                 # conservative launch default (~12 real runs/day); raise once validated
      - key: FILG_PUBLIC_URL       # public base url for Stripe checkout success/cancel redirects
        value: https://fuckitletsgo.ai
      # ── Auth (Supabase, asymmetric/JWKS) — leave blank for free-tier-only launch ──
      # Server verifies user JWTs against the project's public JWKS via SUPABASE_URL — no shared
      # secret. Needs an asymmetric signing key active (Settings → JWT Keys).
      - key: SUPABASE_URL              # project url; also the JWKS source for token verification
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY  # sb_publishable_… (frontend) — safe in the browser
        sync: false
      # ── Billing (Stripe) — leave blank until you're ready to charge ──
      - key: STRIPE_SECRET_KEY     # secret — sk_live_… / sk_test_…
        sync: false
      - key: STRIPE_PRICE_ID       # the $39/mo recurring price id (price_…)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # secret — whsec_… for POST /api/stripe/webhook
        sync: false
